# Default to the in-memory H2 profile so the app runs out-of-the-box in any IDE
# without requiring a running MySQL instance.
# To run against MySQL instead, start with: --spring.profiles.active=mysql
spring.profiles.active=h2

spring.jpa.hibernate.ddl-auto = update

# Spring MVC view resolver for JSP pages (Summary tab and module tabs)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
